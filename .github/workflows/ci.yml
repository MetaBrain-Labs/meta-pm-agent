name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: release_test
          POSTGRES_PASSWORD: release_test
          POSTGRES_DB: release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_test -d release_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: release_test
      POSTGRES_DB: release_test
      POSTGRES_SCHEMA: public
      POSTGRES_SSL: "false"
      OPENAI_API_KEY: release-test-placeholder
      LANGSMITH_TRACING: "false"
      PROCESS_CRASH_REPORT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/database db:generate
      - name: Initialize empty database
        run: pnpm --filter @repo/database db:init
      - name: Verify repeatable upgrade
        run: pnpm --filter @repo/database db:upgrade
      - run: pnpm build
      - run: pnpm --filter @repo/agent-runtime test
      - run: pnpm --filter @repo/api test
      - name: PostgreSQL integration tests
        run: pnpm --filter @repo/api exec tsx --test test/chat-db.integration.test.ts test/runtime-tables-db.integration.test.ts
        env:
          RUN_DB_INTEGRATION: "1"
      - name: Redacted secret audit
        run: python3 scripts/audit-release.py --fail-on-secrets
